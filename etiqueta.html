<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Etiqueta AREA 51</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #111;
      display: flex;
      justify-content: center;
    }

    .card {
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      width: 320px;
      box-shadow: 0 0 10px rgba(0,0,0,0.5);
    }

    h2 {
      margin: 0 0 10px;
      font-size: 20px;
      text-align: center;
    }

    label {
      font-weight: bold;
      font-size: 13px;
      display: block;
      margin-top: 10px;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 14px;
      box-sizing: border-box;
    }

    .row {
      display: flex;
      gap: 8px;
      margin-top: 8px;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-weight: bold;
      margin-top: 12px;
    }

    .btn-load {
      background: #00e676;
      color: #000;
    }

    .btn-gen {
      background: #111;
      color: #fff;
    }

    .btn-print {
      background: #2196f3;
      color: #fff;
    }

    .status {
      margin-top: 8px;
      font-size: 12px;
    }
    .ok { color: #0a8f3c; }
    .err { color: #c62828; }

    .preview {
      margin-top: 16px;
      padding: 14px;
      border: 2px dashed #444;
      border-radius: 10px;
      background: #f9f9f9;
      font-size: 16px;
      display: none;
    }

    /* IMPRESION: que salga solo la etiqueta */
    @media print {
      body { background: #fff !important; padding: 0 !important; }
      .card > :not(.preview) { display: none !important; }
      .preview {
        display: block !important;
        border: 2px solid #000 !important;
        border-radius: 8px !important;
        margin: 0 !important;
      }
    }
  </style>
</head>

<body>
  <div class="card">
    <h2>Etiqueta AREA 51</h2>

    <label>N° de Orden</label>
    <div class="row">
      <input id="orden" type="text" placeholder="A51-2025-12-04-0006" />
    </div>

    <button class="btn-load" id="btnCargar">Cargar datos</button>
    <div id="estado" class="status"></div>

    <label>Cliente (Nombre y apellido)</label>
    <input id="cliente" type="text" placeholder="Se autocompleta al cargar" />

    <label>Equipo (opcional)</label>
    <input id="equipo" type="text" placeholder="Opcional" />

    <label>Modelo (opcional)</label>
    <input id="modelo" type="text" placeholder="Opcional" />

    <button class="btn-gen" id="btnGenerar">Generar etiqueta</button>

    <!-- ✅ le dejamos ID para capturar como imagen -->
    <div id="preview" class="preview"></div>

    <!-- ✅ cambia de Imprimir a Descargar -->
    <button class="btn-print" id="btnDownload" style="display:none;">⬇️ Descargar</button>
  </div>

  <!-- ✅ Librería para convertir el DIV a imagen -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<script>
  // ✅ Tu WebApp (el mismo Apps Script que ya usás)
  const API_URL =
    "https://script.google.com/macros/s/AKfycbwtLCKoaMMRdradoAmuOFJ60BfCTHN2OMZpHtYUd5cf39YNdE_U9B8hUXjogIGp9DnPLg/exec";

  const ordenInput   = document.getElementById("orden");
  const clienteInput = document.getElementById("cliente");
  const equipoInput  = document.getElementById("equipo");
  const modeloInput  = document.getElementById("modelo");

  const estadoDiv = document.getElementById("estado");
  const previewDiv = document.getElementById("preview");
  const btnDownload = document.getElementById("btnDownload");

  function setStatus(msg, ok) {
    estadoDiv.textContent = msg;
    estadoDiv.className = "status " + (ok ? "ok" : "err");
  }

  async function cargarDatosPorOrden() {
    const ordenId = ordenInput.value.trim();
    if (!ordenId) {
      setStatus("Ingresá un N° de orden.", false);
      return;
    }

    setStatus("Cargando datos...", true);

    try {
      const res = await fetch(API_URL + "?ordenId=" + encodeURIComponent(ordenId));
      const data = await res.json();

      if (!data.ok) {
        setStatus("Orden no encontrada.", false);
        return;
      }

      // ✅ Autocompleta nombre/apellido del cliente
      clienteInput.value = data.nombre || "";

      // (Opcional pero útil) Autocompleta equipo/modelo si querés
      equipoInput.value = data.equipo || "";
      modeloInput.value = data.modelo || "";

      setStatus("Datos cargados OK ✅", true);

    } catch (e) {
      console.error(e);
      setStatus("Error al conectar con el sistema.", false);
    }
  }

  function generarEtiqueta() {
    const orden = ordenInput.value.trim();
    const cliente = clienteInput.value.trim();

    if (!orden) {
      alert("Poné el N° de orden.");
      return;
    }
    if (!cliente) {
      alert("Falta el nombre del cliente (cargalo o escribilo).");
      return;
    }

    const equipo = equipoInput.value.trim();
    const modelo = modeloInput.value.trim();

    const etiqueta =
      "<div style='text-align:center; font-weight:bold; font-size:18px;'>AREA 51</div>" +
      "<div style='margin-top:8px; font-size:16px;'><b>🆔 Orden:</b> " + escapeHtml(orden) + "</div>" +
      "<div style='margin-top:6px; font-size:16px;'><b>👤 Cliente:</b> " + escapeHtml(cliente) + "</div>" +
      (equipo ? "<div style='margin-top:6px; font-size:16px;'><b>🎮 Equipo:</b> " + escapeHtml(equipo) + "</div>" : "") +
      (modelo ? "<div style='margin-top:6px; font-size:16px;'><b>🏷 Modelo:</b> " + escapeHtml(modelo) + "</div>" : "") +
      "<hr style='margin:12px 0; border:0; border-top:1px solid #000;'>" +
      "<div style='text-align:center; font-size:12px;'><b>NO RETIRAR ETIQUETA</b></div>";

    previewDiv.innerHTML = etiqueta;
    previewDiv.style.display = "block";
    btnDownload.style.display = "block";

    // ✅ OPCIONAL: si querés que al generar se descargue sola, descomentá:
    // descargarEtiquetaComoImagen();
  }

  // ✅ Descarga la etiqueta generada como PNG (imagen)
  async function descargarEtiquetaComoImagen() {
    if (previewDiv.style.display === "none" || !previewDiv.innerHTML.trim()) {
      alert("Primero generá la etiqueta.");
      return;
    }

    const orden = (ordenInput.value || "AREA51").trim();
    const safeOrden = orden.replace(/[^\w\-]+/g, "_");
    const filename = `Etiqueta_${safeOrden}.png`;

    try {
      // Captura SOLO el preview
      const canvas = await html2canvas(previewDiv, {
        scale: 2,
        backgroundColor: "#f9f9f9"
      });

      const dataUrl = canvas.toDataURL("image/png");

      const a = document.createElement("a");
      a.href = dataUrl;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

    } catch (err) {
      console.error(err);
      alert("No se pudo generar la imagen de la etiqueta.");
    }
  }

  // Seguridad mínima para no romper HTML si escriben caracteres raros
  function escapeHtml(str) {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  document.getElementById("btnCargar").addEventListener("click", cargarDatosPorOrden);
  document.getElementById("btnGenerar").addEventListener("click", generarEtiqueta);

  // ✅ Botón Descargar
  btnDownload.addEventListener("click", descargarEtiquetaComoImagen);

  // Extra: si abrís la URL con ?ordenId=XXXX, lo precarga solo
  (function autoByUrl() {
    const url = new URL(window.location.href);
    const oid = url.searchParams.get("ordenId");
    if (oid) {
      ordenInput.value = oid;
      cargarDatosPorOrden();
    }
  })();
</script>

</body>
</html>
